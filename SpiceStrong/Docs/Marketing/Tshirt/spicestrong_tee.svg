<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 4200" width="3600" height="4200">
  <defs>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#E85D26"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFC03A"/>
      <stop offset="45%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#C44017"/>
    </linearGradient>
  </defs>

  <!-- ============== TOP ICON: FLAME + BARBELL CREST ============== -->
  <g transform="translate(1800 780)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="520" fill="none" stroke="url(#creamGrad)" stroke-width="22"/>
    <circle cx="0" cy="0" r="470" fill="none" stroke="url(#copperGrad)" stroke-width="10"/>

    <!-- Flame / chili silhouette -->
    <path d="M 0 -380
             C 110 -260, 200 -180, 220 -40
             C 240 110, 170 220, 90 260
             C 150 200, 160 130, 130 70
             C 100 130, 50 160, -20 170
             C -110 180, -200 110, -210 0
             C -220 -120, -130 -240, -60 -310
             C -40 -260, -30 -210, -10 -170
             C 10 -240, 0 -310, 0 -380 Z"
          fill="url(#flameGrad)"/>

    <!-- Inner flame highlight -->
    <path d="M -30 -280
             C 30 -200, 80 -130, 80 -40
             C 80 50, 30 110, -30 130
             C 10 80, 20 30, 0 -10
             C -20 30, -50 50, -90 50
             C -130 40, -160 0, -150 -60
             C -140 -130, -90 -200, -40 -240
             C -30 -210, -25 -180, -30 -280 Z"
          fill="#FFD46A" opacity="0.85"/>

    <!-- Barbell across the bottom of the crest -->
    <g transform="translate(0 320)">
      <!-- Bar -->
      <rect x="-380" y="-22" width="760" height="44" rx="6" fill="url(#creamGrad)"/>
      <!-- Inner plates -->
      <rect x="-300" y="-90" width="60" height="180" rx="10" fill="url(#copperGrad)"/>
      <rect x="240" y="-90" width="60" height="180" rx="10" fill="url(#copperGrad)"/>
      <!-- Outer plates -->
      <rect x="-410" y="-130" width="80" height="260" rx="14" fill="url(#creamGrad)"/>
      <rect x="330" y="-130" width="80" height="260" rx="14" fill="url(#creamGrad)"/>
      <!-- End caps -->
      <rect x="-450" y="-50" width="30" height="100" rx="6" fill="url(#copperGrad)"/>
      <rect x="420" y="-50" width="30" height="100" rx="6" fill="url(#copperGrad)"/>
    </g>
  </g>

  <!-- ============== WORDMARK: SPICE / STRONG ============== -->
  <!-- Top accent bars -->
  <g transform="translate(1800 1500)">
    <rect x="-900" y="-12" width="700" height="24" fill="url(#copperGrad)"/>
    <rect x="200"  y="-12" width="700" height="24" fill="url(#copperGrad)"/>
    <polygon points="-200,0 -160,-50 -160,50" fill="url(#copperGrad)"/>
    <polygon points="200,0 160,-50 160,50" fill="url(#copperGrad)"/>
  </g>

  <text x="1800" y="2050"
        font-family="DejaVu Sans Condensed, Liberation Sans, sans-serif"
        font-weight="900"
        font-size="780"
        letter-spacing="40"
        text-anchor="middle"
        fill="url(#creamGrad)"
        stroke="#0F0F0F" stroke-width="6">SPICE</text>

  <text x="1800" y="2780"
        font-family="DejaVu Sans Condensed, Liberation Sans, sans-serif"
        font-weight="900"
        font-size="780"
        letter-spacing="20"
        text-anchor="middle"
        fill="url(#copperGrad)">STRONG</text>

  <!-- ============== DIVIDER + TAGLINE ============== -->
  <g transform="translate(1800 3050)">
    <line x1="-700" y1="0" x2="-180" y2="0" stroke="#F5F1E8" stroke-width="6"/>
    <line x1="180"  y1="0" x2="700" y2="0" stroke="#F5F1E8" stroke-width="6"/>
    <!-- Center diamond -->
    <polygon points="0,-30 30,0 0,30 -30,0" fill="url(#copperGrad)"/>
    <polygon points="-130,-18 -110,0 -130,18 -150,0" fill="#F5F1E8"/>
    <polygon points="130,-18 110,0 130,18 150,0" fill="#F5F1E8"/>
  </g>

  <text x="1800" y="3280"
        font-family="Lato Black, DejaVu Sans, sans-serif"
        font-weight="900"
        font-size="240"
        letter-spacing="60"
        text-anchor="middle"
        fill="#F5F1E8">FUEL THE FIRE</text>

  <!-- ============== SUB-LINE ============== -->
  <text x="1800" y="3520"
        font-family="DejaVu Sans Condensed, Liberation Sans, sans-serif"
        font-weight="700"
        font-size="120"
        letter-spacing="40"
        text-anchor="middle"
        fill="#E85D26">HIGH-PROTEIN  ·  INDIAN  ·  KITCHEN</text>

  <!-- ============== BOTTOM URL ============== -->
  <g transform="translate(1800 3900)">
    <rect x="-440" y="-70" width="880" height="120" rx="60" fill="none" stroke="url(#copperGrad)" stroke-width="6"/>
    <text x="0" y="22"
          font-family="Lato Black, DejaVu Sans, sans-serif"
          font-weight="900"
          font-size="100"
          letter-spacing="20"
          text-anchor="middle"
          fill="url(#creamGrad)">SPICESTRONG.APP</text>
  </g>
</svg>
